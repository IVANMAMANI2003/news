version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: news_scraper_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - news_net

  postgres:
    image: postgres:15
    container_name: news_scraper_db
    environment:
      POSTGRES_DB: news_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - news_net

  celery-worker:
    build: .
    container_name: news_scraper_worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: news_scraper
      DB_USER: postgres
      DB_PASSWORD: 123456
      SCRAPING_DELAY: 1
      SCRAPING_WORKERS: 10
      SCRAPING_RETRIES: 5
      SCRAPING_INCREMENTAL: "true"
      SOURCE_SIN_FRONTERAS: "true"
      SOURCE_LOS_ANDES: "true"
      SOURCE_PACHAMAMA: "true"
      SOURCE_PUNO_NOTICIAS: "true"
      OUTPUT_CSV: "true"
      OUTPUT_JSON: "true"
      OUTPUT_DIR: "/app/data"
      OUTPUT_TIMESTAMP: "true"
      LOG_LEVEL: INFO
      LOG_FILE: "/app/logs/celery_worker.log"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./codigos-claude:/app/codigos-claude
    restart: unless-stopped
    command: ["celery", "-A", "celery_tasks", "worker", "--loglevel=info", "--concurrency=1"]
    networks:
      - news_net

  celery-beat:
    build: .
    container_name: news_scraper_beat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: news_scraper
      DB_USER: postgres
      DB_PASSWORD: 123456
      LOG_LEVEL: INFO
      LOG_FILE: "/app/logs/celery_beat.log"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["celery", "-A", "celery_tasks", "beat", "--loglevel=info"]
    networks:
      - news_net

volumes:
  postgres_data:
  redis_data:

networks:
  news_net:
    driver: bridge
