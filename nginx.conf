events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Configuración de servidor
    server {
        listen 8080;
        server_name localhost;
        
        # Servir archivos estáticos
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }
        
        # Servir archivos de datos del scraper
        location /data/ {
            alias /usr/share/nginx/html/data/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            
            # Headers para descarga de archivos
            add_header Content-Disposition "attachment" always;
        }
        
        # Servir logs del sistema
        location /logs/ {
            alias /usr/share/nginx/html/logs/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
        
        # Página de monitoreo
        location /monitor {
            alias /usr/share/nginx/html/data/status_report.html;
            try_files $uri =404;
        }
        
        # API simple para estadísticas (opcional)
        location /api/stats {
            return 200 '{"status": "ok", "message": "API funcionando"}';
            add_header Content-Type application/json;
        }
        
        # Configuración de seguridad
        location ~ /\. {
            deny all;
        }
        
        # Configuración de cache para archivos estáticos
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
